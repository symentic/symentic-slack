# Add this to your serverless.yml under provider section

provider:
  name: aws
  runtime: nodejs18.x
  # ... other settings ...
  
  # VPC Configuration
  vpc:
    securityGroupIds:
      - sg-0123456789abcdef0  # Replace with your Lambda security group ID
    subnetIds:
      - subnet-0123456789abcdef0  # Replace with your private subnet 1 ID
      - subnet-0123456789abcdef1  # Replace with your private subnet 2 ID
  
  # IAM permissions for VPC
  iamRoleStatements:
    # ... existing permissions ...
    - Effect: Allow
      Action:
        - ec2:CreateNetworkInterface
        - ec2:DescribeNetworkInterfaces
        - ec2:DeleteNetworkInterface
        - ec2:AssignPrivateIpAddresses
        - ec2:UnassignPrivateIpAddresses
      Resource: "*"